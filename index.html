<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Jelly House Aju</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="background">
		<section id="page">
			<div id="logo">
				<img src="assets/logo.png" alt="Jelly House Aju">
			</div>
			<section class="produtos-container">
	<section class="produtos-scroll">
		<div class="produtos">
			<div class="produto-card">
				<div class="produto-ilustracao">
					<img src="assets/maracuja.png" alt="Produto de maracujá">
				</div>
				<button type="button">MARACUJÁ</button>
			</div>
			<div class="produto-card">
				<div class="produto-ilustracao">
					<img src="assets/morango.png" alt="Produto de morango">
				</div>
				<button type="button">MORANGO</button>
			</div>
			<div class="produto-card">
				<div class="produto-ilustracao">
					<img src="assets/mangaba.png" alt="Produto de mangaba">
				</div>
				<button type="button">MANGABA</button>
			</div>
		</div>
	</section>
</section>
	</main>
    <script src="index.js"></script>
</body>
</html>
