<!DOCTYPE html>
<html lang="pt-BR">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0">

	<title>Jelly House Aju</title>

	<link
		rel="stylesheet"
		href="styles.css">

	<!-- Font Awesome -->
	<link
		rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


	<!-- =====================================================
	     TELA DE CARREGAMENTO
	===================================================== -->

	<div id="loading-screen">

		<div class="loading-content">

			<img
				class="loading-papagaio"
				src="assets/papagaio_5.png"
				alt="Carregando">

			<div class="loading-balao">

				<span class="loading-pontos"></span>

			</div>

		</div>

	</div>



	<!-- =====================================================
	     FUNDO PRINCIPAL
	===================================================== -->

	<main class="background">


		


		<!-- =================================================
		     PÁGINA
		================================================= -->

		<section id="page">


			<!-- LOGO -->

			<div id="logo">

				<img
					src="assets/logo.png"
					alt="Jelly House Aju">

			</div>



			<!-- =================================================
			     PRODUTOS
			================================================= -->

			<section class="produtos-container">

				<div class="produtos-scroll">

					<div class="produtos">


						<!-- =====================================
						     MARACUJÁ
						===================================== -->

						<div class="produto-item">

							<img
								class="fruta-topo"
								src="assets/maracuja.png"
								alt="Maracujá">

							<div class="produto-card">

								<div class="produto-ilustracao">

									<img
										src="assets/Produto de maracujá.png"
										alt="Produto de maracujá">

								</div>

								<button type="button">
									MARACUJÁ
								</button>

							</div>

						</div>



						<!-- =====================================
						     MORANGO
						===================================== -->

						<div class="produto-item">

							<img
								class="fruta-topo"
								src="assets/morango.png"
								alt="Morango">

							<div class="produto-card">

								<div class="produto-ilustracao">

									<img
										src="assets/Produto de morango.png"
										alt="Produto de morango">

								</div>

								<button type="button">
									MORANGO
								</button>

							</div>

						</div>



						<!-- =====================================
						     MANGABA
						===================================== -->

						<div class="produto-item">

							<img
								class="fruta-topo"
								src="assets/mangaba.png"
								alt="Mangaba">

							<div class="produto-card">

								<div class="produto-ilustracao">

									<img
										src="assets/Produto de mangaba.png"
										alt="Produto de mangaba">

								</div>

								<button type="button">
									MANGABA
								</button>

							</div>

						</div>


					</div>

				</div>

			</section>


		</section>


	</main>


	<!-- =====================================================
	     JAVASCRIPT
	===================================================== -->

	<script src="index.js"></script>

</body>
<footer>
    <!-- =================================================
		     CONTATOS
		================================================= -->

		<div class="contatos">


			<!-- INSTAGRAM -->

			<a
				class="contato instagram"
				href="https://www.instagram.com/jellyhouseaju/"
				target="_blank"
				rel="noopener noreferrer">

				<i class="fa-brands fa-instagram"></i>

				<span>@jellyhouseaju</span>

			</a>


			<!-- WHATSAPP -->

			<a
				class="contato whatsapp"
				href="https://wa.me/5579996479489"
				target="_blank"
				rel="noopener noreferrer">

				<i class="fa-brands fa-whatsapp"></i>

				<span>WhatsApp</span>

			</a>


		</div>

</footer>

</html>
